services:
  xpand:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - xpand-data:/app/data
    restart: unless-stopped

volumes:
  xpand-data:
